[workspace]
resolver = "2"
members = [
    "crates/boot-doctor-core",
    "crates/boot-doctor-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Adesh Suryan <887994+adeshsuryan@users.noreply.github.com>"]
repository = "https://github.com/adeshsuryan/linux-boot-doctor"
homepage = "https://github.com/adeshsuryan/linux-boot-doctor"
readme = "README.md"

[workspace.dependencies]
boot-doctor-core = { path = "crates/boot-doctor-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
clap = { version = "4", features = ["derive"] }
