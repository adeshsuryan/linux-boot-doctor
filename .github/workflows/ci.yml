name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Fixture smoke
        run: |
          cargo build -p linux-boot-doctor
          # slow-total must exit 1 (findings). Capture status under set +e so bash -e
          # does not abort before the equality check.
          set +e
          ./target/debug/linux-boot-doctor check --input fixtures/slow-total --fail-on high
          status=$?
          set -e
          test "$status" -eq 1
          ./target/debug/linux-boot-doctor check --input fixtures/clean-boot --fail-on high
