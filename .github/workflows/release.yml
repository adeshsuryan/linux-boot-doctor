name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: linux-amd64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release
        run: cargo build --release -p linux-boot-doctor --target ${{ matrix.target }}
      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BIN=target/${{ matrix.target }}/release/linux-boot-doctor
          STAGE=linux-boot-doctor-${VERSION}-${{ matrix.artifact }}
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/linux-boot-doctor"
          cp README.md LICENSE CHANGELOG.md SECURITY.md "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          path: |
            linux-boot-doctor-*.tar.gz
            linux-boot-doctor-*.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          cat *.sha256 > SHA256SUMS || sha256sum *.tar.gz > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          body_path: CHANGELOG.md
